name: Model Conversion

on:
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at midnight
  workflow_dispatch:
    inputs:
      force:
        description: "Force re-convert (ignore SHA checks)"
        required: false
        default: false
        type: boolean    
      filter:
        description: "Model filter (regex)"
        required: false
        default: ""
      hardware:
        description: "HF Jobs flavor"
        required: false
        default: ""
      llama_commit:
        description: "llama.cpp commit to checkout"
        required: false
        default: ""
      timeout:
        description: "HF Job timeout (e.g. 2h, 30m)"
        required: false
        default: ""

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Launch HF Job
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_CONVERT }}
        run: |
          FILTER_ARGS=""
          if [ -n "${{ github.event.inputs.filter }}" ]; then
            FILTER_ARGS="--filter ${{ github.event.inputs.filter }}"
          fi
          FORCE_ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_ARGS="--force"
          fi
          HARDWARE_ARGS=""
          if [ -n "${{ github.event.inputs.hardware }}" ]; then
            HARDWARE_ARGS="--hardware ${{ github.event.inputs.hardware }}"
          fi
          LLAMA_COMMIT_ARGS=""
          if [ -n "${{ github.event.inputs.llama_commit }}" ]; then
            LLAMA_COMMIT_ARGS="--llama-commit ${{ github.event.inputs.llama_commit }}"
          fi
          TIMEOUT_ARGS=""
          if [ -n "${{ github.event.inputs.timeout }}" ]; then
            TIMEOUT_ARGS="--timeout ${{ github.event.inputs.timeout }}"
          fi
          BRANCH_ARGS="--branch ${{ github.ref_name }}"
          bash hf-job.sh --owner ggml-org $FILTER_ARGS $FORCE_ARGS $HARDWARE_ARGS $LLAMA_COMMIT_ARGS $TIMEOUT_ARGS $BRANCH_ARGS
